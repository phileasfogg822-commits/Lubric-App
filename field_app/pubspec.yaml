name: lubric_field
description: "Lubric Field - finance companion for field staff (collections, handovers, reports)."
publish_to: "none"

# versionName is what users see; the integer after + is versionCode.
# Bump BOTH when publishing an update - the app compares versionCode against
# /updates/android.json on the server to decide whether an update exists.
#   0.1.0+1  first native build
#   0.2.0+2  fix: Pair button was permanently disabled
#   0.3.0+3  cleartext HTTP allowed - still no network: no INTERNET permission
#   0.4.0+4  add the INTERNET permission Flutter omits from release builds
#   0.5.0+5  fix: the updater could never offer an update, and every build was
#            signed with a throwaway key. From this build on, the phone updates
#            itself. ONE last manual install is required to get here.
#   0.6.0+6  sync failures now say which step broke and why, instead of
#            "cannot sync"; More shows the last problem and can test the
#            connection; the pull cursor only advances past stored rows.
#   0.6.1+7  THE SYNC FIX. The outbox encoder emitted invalid JSON (string
#            values were never quoted), so every queued row failed to upload
#            and no phone data had ever reached the shop. Payloads are now
#            built by a tested pure function and encoded with jsonEncode; rows
#            already stuck are rebuilt from the local table on upgrade.
#            Updates also carry REQUEST_INSTALL_PACKAGES, without which
#            Android silently refused to install the downloaded APK.
#            Android silently refused to install the downloaded APK.
#   0.6.2+8  the shop asked to know WHO is in the field, not just which phone.
#            More now asks the collector's name once and stamps it on every
#            collection, so a shared handset no longer hides who took the money.
version: 0.6.2+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- storage ---
  sqflite: ^2.3.3          # offline-first SQLite
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # --- networking ---
  dio: ^5.7.0              # download with progress for the APK updater

  # --- native integration ---
  share_plus: ^10.1.2      # native share sheet -> WhatsApp / Gmail / Drive
  open_filex: ^4.5.0       # opens PDFs and launches the APK installer
  package_info_plus: ^8.1.1  # reads the installed versionCode

  # --- formatting / hashing ---
  intl: ^0.19.0            # currency + dates (PKR)
  crypto: ^3.0.5           # sha256 verification of downloaded APKs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
