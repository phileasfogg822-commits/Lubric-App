version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: lubricapp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lubricapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lubricapp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lubricapp
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: lubricapp-dev-secret-change-in-production
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node migrate.js && node --watch index.js"

  # React Frontend (Vite Dev Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lubricapp-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: ""
      API_PROXY_URL: "http://backend:3001"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
