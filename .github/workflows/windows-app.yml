name: Windows App (lubric.app)

# Builds the standalone Windows app (Tauri 2 + local SQLite) in src-tauri/.
# One install, one local database, no server, no sync — the sync/cloud code
# stays in the bundle as the upgrade path, but the default storage is local.
# The installer is an NSIS .exe; Umar installs it on his Windows PC and
# tests it there, same loop as the APKs.
on:
  push:
    branches: [windows-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Full history, not the default shallow checkout: the version-display
      # sim proves its red-before case against the commit BEFORE batch 5,
      # resolved dynamically as the parent of the commit that added
      # src/lib/version.ts — that ref sits further back with every
      # follow-up commit, so a fixed fetch-depth would starve it again.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # Counted unit suite (offline-safe only — the e2e_* suites that need a
      # live API + Postgres are NOT run here). Each unit file prints N/M
      # passed and exits 1 on failure, so the loop is the gate. The sims
      # replay exact app statements against the real schema / server
      # permissions code; each prints N/M and exits 1 on failure.
      - name: Unit tests gate the build
        run: |
          foreach ($f in Get-ChildItem server/unit_*.js) {
            node $f.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          node --experimental-strip-types server/e2e_ledger_sqlite.js
          node --experimental-strip-types server/sim_windows_login.js
          node --experimental-strip-types server/sim_windows_v2_permissions.js
          node --experimental-strip-types server/sim_vps_port.js
          node --experimental-strip-types server/sim_remove_backdoor.js
          node --experimental-strip-types server/sim_stock_levels_unique.js
          node --experimental-strip-types server/sim_stock_levels_upgrade.js
          node --experimental-strip-types server/sim_sale_default_warehouse.js
          node --experimental-strip-types server/sim_sale_default_warehouse_upgrade.js
          node --experimental-strip-types server/sim_sale_permissions.js
          node --experimental-strip-types server/sim_dashboard_permissions.js
          node --experimental-strip-types server/sim_sale_locked_busy.js
          node --experimental-strip-types server/sim_sale_duplicate_uuid.js
          node --experimental-strip-types server/sim_sale_2067_deterministic.js
          node --experimental-strip-types server/sim_sale_pool_atomicity.js
          node --experimental-strip-types server/sim_sale_uuid_binding.js
          node --experimental-strip-types server/sim_sale_stock_guard.js
          node --experimental-strip-types server/sim_used_oil_notes.js
          node --experimental-strip-types server/sim_expenses_list.js
          node --experimental-strip-types server/sim_sales_history_dashboard_trend.js
          node --experimental-strip-types server/sim_sale_service_reminder.js
          node --experimental-strip-types server/sim_sale_payment_options.js
          node --experimental-strip-types server/sim_leftover_container_pricing.js
          node --experimental-strip-types server/sim_purchase_invoice_stock_in.js
          node --experimental-strip-types server/sim_purchase_items_schema_upgrade.js
          node --experimental-strip-types server/sim_batch15_permissions.js
          node --experimental-strip-types server/sim_activity_log.js
          node --experimental-strip-types server/sim_trial_codes.js
          node --experimental-strip-types server/sim_trial_licensing.js
          node --experimental-strip-types server/sim_trial_licence_renewal.js
          node --experimental-strip-types server/sim_announcements.js
          node --experimental-strip-types server/sim_updater_feed.js
        shell: pwsh

      # tsc + vite build for the web bundle (PWA stays on here — the Tauri
      # build below re-runs it with TAURI_ENV_PLATFORM set, which disables
      # the service worker). The build bakes its identity (src/lib/version.ts)
      # from the environment when set, else from package.json + git in
      # vite.config.ts — either way the real head SHA, never "unknown".
      - name: Typecheck + web build
        run: |
          $env:VITE_GIT_SHA = $env:GITHUB_SHA
          # Canonical 3-digit ISO UTC (e.g. 2026-11-25T01:23:45.123Z). The
          # .NET "o" round-trip format emits SEVEN fractional digits, which
          # the version sim's timestamp check did not accept (CI 45479998849).
          # 'T' and 'Z' are quoted literals — unquoted T is the .NET long-time
          # pattern, not the letter T.
          $env:VITE_BUILD_DATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss.fff'Z'")
          $env:VITE_GIT_SUBJECT = git log -1 --format=%s
          npm run build
        shell: pwsh

      # Needs the built bundle: proves the login screen shows the baked
      # version + head SHA + build date (and that the previous build did not).
      - name: Version display sim
        run: node server/sim_version_display.js
        shell: pwsh

      # Batch 17: the signed updater build needs TAURI_SIGNING_PRIVATE_KEY,
      # and the build FAILS if createUpdaterArtifacts is on without the key
      # — so the base config leaves artifacts off, and the overlay config
      # (src-tauri/tauri.updater.conf.json) turns them on ONLY when the
      # secret exists. Before Umar adds the secret this is a plain build
      # and CI stays green; after, the same step also signs the updater
      # artifacts for the release step below. An empty secret is falsy in
      # PowerShell, so the plain branch runs; the empty env var is never
      # read by the bundler when artifacts are off.
      - name: Build Tauri NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run tauri:build -- --config src-tauri/tauri.updater.conf.json
          } else {
            npm run tauri:build
          }
        shell: pwsh

      # The installer name carries product + version, e.g.
      # lubric.app_0.1.1_x64-setup.exe — record its hash so the delivered
      # file can be verified byte-for-byte after download.
      - name: Record installer SHA-256
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $installer | ForEach-Object { Write-Host "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: lubric-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Batch 17: publish the updater feed to the rolling `windows-latest`
      # GitHub Release — installed apps read latest.json from there (see
      # src/lib/updater.ts UPDATER_FEED_URL). Skipped entirely until Umar
      # adds the TAURI_SIGNING_PRIVATE_KEY repository secret (Settings →
      # Secrets and variables → Actions): the secret holds the CONTENTS of
      # the updater private key file (delivered to Umar privately, never in
      # the repo). The step fails loudly if the signed build produced no
      # .sig file, so a broken signing setup is visible instead of silently
      # shipping an unsigned feed. The release exe is the same build the
      # artifact step above uploads; latest.json lives in RUNNER_TEMP so it
      # never pollutes the tree.
      - name: Publish updater release
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no NSIS installer found in src-tauri/target/release/bundle/nsis"; exit 1 }
          $sigFile = "$($exe.FullName).sig"
          if (-not (Test-Path $sigFile)) { Write-Error "no .sig file next to $($exe.Name) — the signed build did not produce updater artifacts"; exit 1 }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $notes = git log -1 --format=%s
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
          $signature = (Get-Content $sigFile -Raw).Trim()
          $latest = @{
            version = $version
            notes = $notes
            pub_date = $pubDate
            platforms = @{ "windows-x86_64" = @{ url = "https://github.com/phileasfogg822-commits/Lubric-App/releases/download/windows-latest/$($exe.Name)"; signature = $signature } }
          } | ConvertTo-Json -Depth 5
          $latestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          Set-Content -Path $latestPath -Value $latest -Encoding utf8
          gh release view windows-latest --repo phileasfogg822-commits/Lubric-App 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest --repo phileasfogg822-commits/Lubric-App --title "Windows latest" --notes "Rolling release for the lubric.app in-app updater. Do not delete — installed apps read latest.json from here."
          }
          gh release upload windows-latest $exe.FullName $latestPath --clobber --repo phileasfogg822-commits/Lubric-App
          Write-Host "Updater feed published: v$version ($($exe.Name))"
        shell: pwsh
