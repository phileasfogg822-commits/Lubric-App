name: Windows App (lubric.app)

# Builds the standalone Windows app (Tauri 2 + local SQLite) in src-tauri/.
# One install, one local database, no server, no sync — the sync/cloud code
# stays in the bundle as the upgrade path, but the default storage is local.
# The installer is an NSIS .exe; Umar installs it on his Windows PC and
# tests it there, same loop as the APKs.
on:
  push:
    branches: [windows-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Full history, not the default shallow checkout: the version-display
      # sim proves its red-before case against the commit BEFORE batch 5,
      # resolved dynamically as the parent of the commit that added
      # src/lib/version.ts — that ref sits further back with every
      # follow-up commit, so a fixed fetch-depth would starve it again.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # Counted unit suite (offline-safe only — the e2e_* suites that need a
      # live API + Postgres are NOT run here). Each unit file prints N/M
      # passed and exits 1 on failure, so the loop is the gate. The sims
      # replay exact app statements against the real schema / server
      # permissions code; each prints N/M and exits 1 on failure.
      - name: Unit tests gate the build
        run: |
          foreach ($f in Get-ChildItem server/unit_*.js) {
            node $f.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          node --experimental-strip-types server/e2e_ledger_sqlite.js
          node --experimental-strip-types server/sim_windows_login.js
          node --experimental-strip-types server/sim_windows_v2_permissions.js
          node --experimental-strip-types server/sim_vps_port.js
          node --experimental-strip-types server/sim_remove_backdoor.js
          node --experimental-strip-types server/sim_stock_levels_unique.js
          node --experimental-strip-types server/sim_stock_levels_upgrade.js
          node --experimental-strip-types server/sim_sale_default_warehouse.js
          node --experimental-strip-types server/sim_sale_default_warehouse_upgrade.js
          node --experimental-strip-types server/sim_sale_permissions.js
          node --experimental-strip-types server/sim_dashboard_permissions.js
          node --experimental-strip-types server/sim_sale_locked_busy.js
          node --experimental-strip-types server/sim_sale_duplicate_uuid.js
          node --experimental-strip-types server/sim_sale_2067_deterministic.js
          node --experimental-strip-types server/sim_sale_pool_atomicity.js
          node --experimental-strip-types server/sim_sale_uuid_binding.js
          node --experimental-strip-types server/sim_sale_stock_guard.js
          node --experimental-strip-types server/sim_used_oil_notes.js
          node --experimental-strip-types server/sim_expenses_list.js
          node --experimental-strip-types server/sim_sales_history_dashboard_trend.js
          node --experimental-strip-types server/sim_sale_service_reminder.js
          node --experimental-strip-types server/sim_leftover_container_pricing.js
        shell: pwsh

      # tsc + vite build for the web bundle (PWA stays on here — the Tauri
      # build below re-runs it with TAURI_ENV_PLATFORM set, which disables
      # the service worker). The build bakes its identity (src/lib/version.ts)
      # from the environment when set, else from package.json + git in
      # vite.config.ts — either way the real head SHA, never "unknown".
      - name: Typecheck + web build
        run: |
          $env:VITE_GIT_SHA = $env:GITHUB_SHA
          # Canonical 3-digit ISO UTC (e.g. 2026-11-25T01:23:45.123Z). The
          # .NET "o" round-trip format emits SEVEN fractional digits, which
          # the version sim's timestamp check did not accept (CI 45479998849).
          # 'T' and 'Z' are quoted literals — unquoted T is the .NET long-time
          # pattern, not the letter T.
          $env:VITE_BUILD_DATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss.fff'Z'")
          $env:VITE_GIT_SUBJECT = git log -1 --format=%s
          npm run build
        shell: pwsh

      # Needs the built bundle: proves the login screen shows the baked
      # version + head SHA + build date (and that the previous build did not).
      - name: Version display sim
        run: node server/sim_version_display.js
        shell: pwsh

      - name: Build Tauri NSIS installer
        run: npm run tauri:build

      # The installer name carries product + version, e.g.
      # lubric.app_0.1.1_x64-setup.exe — record its hash so the delivered
      # file can be verified byte-for-byte after download.
      - name: Record installer SHA-256
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          $installer | ForEach-Object { Write-Host "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: lubric-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
