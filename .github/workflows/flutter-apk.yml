name: Flutter APK

on:
  push:
    branches: [main, master]
    paths: ["field_app/**", ".github/workflows/flutter-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      # The android/ project is generated rather than committed, so nothing
      # custom can be lost. If you ever need native code of your own, commit
      # field_app/android/ and this step becomes a no-op.
      - name: Generate the Android project
        working-directory: field_app
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org app.lubric \
              --project-name lubric_field
            # `flutter create` also drops a placeholder test/widget_test.dart
            # that references a MyApp class this project does not have. Our own
            # tests live in test/ instead.
            rm -f test/widget_test.dart
          fi

      - name: Resolve packages
        working-directory: field_app
        run: flutter pub get

      - name: Analyze
        working-directory: field_app
        run: flutter analyze lib test --no-fatal-infos

      # Runs the widget tests before an APK is ever produced. The setup-screen
      # regression test lives here: it caught a permanently-disabled Pair
      # button that unit review had missed.
      - name: Test
        working-directory: field_app
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: field_app
        run: |
          # REQUIRED: Android 9+ blocks plain HTTP by default and Flutter's
          # generated manifest never opts in, so the app cannot reach an
          # http:// server at all. This writes a network security config and
          # points the manifest at it. A previous sed for
          # usesCleartextTraffic="false" silently did nothing, because that
          # string does not exist in Flutter's template.
          python3 tool/patch_android.py
          flutter build apk --release

      - name: Checksum
        working-directory: field_app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          sha256sum "$APK" | tee apk-sha256.txt
          echo "size: $(du -h "$APK" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: lubric-field-apk
          path: |
            field_app/build/app/outputs/flutter-apk/app-release.apk
            field_app/apk-sha256.txt
          if-no-files-found: error
