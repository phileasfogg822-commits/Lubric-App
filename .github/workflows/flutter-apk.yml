name: Flutter APK

on:
  push:
    branches: [main, master]
    paths: ["field_app/**", ".github/workflows/flutter-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      # The android/ project is generated rather than committed, so nothing
      # custom can be lost. If you ever need native code of your own, commit
      # field_app/android/ and this step becomes a no-op.
      - name: Generate the Android project
        working-directory: field_app
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org app.lubric \
              --project-name lubric_field
          fi

      - name: Resolve packages
        working-directory: field_app
        run: flutter pub get

      - name: Analyze
        working-directory: field_app
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: field_app
        run: |
          # These two settings are required on Android for the in-app updater:
          # the app downloads an APK over plain HTTP from the shop server, and
          # hands it to the system installer via a FileProvider content:// URI.
          sed -i 's/android:usesCleartextTraffic="false"/android:usesCleartextTraffic="true"/' \
            android/app/src/main/AndroidManifest.xml || true
          flutter build apk --release

      - name: Checksum
        working-directory: field_app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          sha256sum "$APK" | tee apk-sha256.txt
          echo "size: $(du -h "$APK" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: lubric-field-apk
          path: |
            field_app/build/app/outputs/flutter-apk/app-release.apk
            field_app/apk-sha256.txt
          if-no-files-found: error
