name: Flutter APK

on:
  push:
    branches: [main, master]
    paths: ["field_app/**", ".github/workflows/flutter-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      # The android/ project is generated rather than committed, so nothing
      # custom can be lost. If you ever need native code of your own, commit
      # field_app/android/ and this step becomes a no-op.
      - name: Generate the Android project
        working-directory: field_app
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org app.lubric \
              --project-name lubric_field
            # `flutter create` also drops a placeholder test/widget_test.dart
            # that references a MyApp class this project does not have. Our own
            # tests live in test/ instead.
            rm -f test/widget_test.dart
          fi
          # This block decides whether the release build signs with the shop's
          # key or silently falls back to the debug key. Print it, so a signing
          # failure can be read off the log instead of guessed at.
          echo "--- generated android/app/build.gradle: signing config ---"
          sed -n '/signingConfigs/,/^}/p' android/app/build.gradle 2>/dev/null | head -30 \
            || echo "(could not read android/app/build.gradle)"

      - name: Resolve packages
        working-directory: field_app
        run: flutter pub get

      - name: Analyze
        working-directory: field_app
        run: flutter analyze lib test --no-fatal-infos

      # Runs the widget tests before an APK is ever produced. The setup-screen
      # regression test lives here: it caught a permanently-disabled Pair
      # button that unit review had missed.
      - name: Test
        working-directory: field_app
        run: flutter test --reporter expanded

      # Sign the release build with the SHOP'S key, not a throwaway one.
      #
      # Every build used to be signed with the debug key the runner generates
      # fresh on each job, so every APK had a different certificate. Android
      # refuses to install an update whose signature differs from the installed
      # one ("App not installed"), so each release had to be uninstalled by hand
      # first - and uninstalling wipes the local database and the pairing, so the
      # phone had to be set up again from scratch. That is the other half of
      # "the app never updates itself".
      - name: Restore the release signing key
        working-directory: field_app
        env:
          KEYSTORE_B64: ${{ secrets.LUBRIC_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUBRIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUBRIC_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::LUBRIC_KEYSTORE_BASE64 is not set - the build would be"
            echo "::error::signed with an ephemeral debug key and could never be"
            echo "::error::installed as an in-place update."
            exit 1
          fi

          mkdir -p android
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks

          # storeFile MUST be absolute. The generated build.gradle resolves it
          # with file(), which is relative to the android/app module, not to the
          # android/ directory the file itself lives in. A relative name
          # therefore silently resolves to a path that does not exist, Gradle
          # falls back to the debug signing config, and the APK comes out signed
          # with a throwaway key - which is exactly the bug being fixed here.
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" \
            "$(pwd)/android/upload-keystore.jks" > android/key.properties

          # Prove the material is real BEFORE spending six minutes on a build.
          # Failing here is the whole point: a build that "succeeds" while
          # signing with the debug key is the failure mode.
          test -s android/upload-keystore.jks || { echo "::error::keystore is empty"; exit 1; }
          test -s android/key.properties    || { echo "::error::key.properties is empty"; exit 1; }
          keytool -list -keystore android/upload-keystore.jks \
                  -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::the keystore or its password/alias is wrong"; exit 1; }
          echo "    keystore restored and opens with the configured alias"

      - name: Build release APK
        working-directory: field_app
        run: |
          # REQUIRED: fixes two Flutter release-build traps that each make the
          # app unable to reach the server at all:
          #   * android.permission.INTERNET lives only in the debug/profile
          #     manifests, so a release APK cannot make any request;
          #   * cleartext HTTP is blocked by default from Android 9 onwards.
          python3 tool/patch_android.py
          flutter build apk --release

      # Android only accepts an in-place update when the signing certificate is
      # identical to the installed one. Failing here is far better than shipping
      # an APK that forces every field phone to be wiped and re-paired.
      - name: Verify the APK is signed with the shop's release key
        working-directory: field_app
        env:
          EXPECTED_FINGERPRINT: ${{ vars.LUBRIC_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk

          # apksigner is authoritative: it reports the certificate that actually
          # signs the APK, including v2/v3-only signatures that have no v1
          # META-INF block at all. Reading a cert out of META-INF by hand can pick
          # a timestamp-authority cert from the PKCS#7 bag instead of the signer.
          APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ANDROID_HOME=${ANDROID_HOME:-unset}"
            exit 1
          fi

          echo "    every certificate carried in the APK:"
          for f in $(unzip -Z1 "$APK" | grep -iE '^META-INF/.*\.(RSA|DSA|EC)$' || true); do
            fp=$(unzip -p "$APK" "$f" | openssl pkcs7 -inform DER -print_certs 2>/dev/null \
                 | openssl x509 -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)
            echo "      $f -> ${fp:-<unreadable>}"
          done

          GOT=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null \
                | sed -n 's/.*SHA-256 digest: //p' | head -1)
          if [ -z "$GOT" ]; then
            echo "::error::could not read a signing certificate from the APK"
            exit 1
          fi
          echo "    apksigner says the signer is: $GOT"

          # keytool prints upper-case hex, apksigner lower-case. Compare the
          # hex only, case-insensitively, with the separators stripped.
          norm() { echo "$1" | tr '[:upper:]' '[:lower:]' | tr -d ':'; }
          if [ "$(norm "$GOT")" != "$(norm "$EXPECTED_FINGERPRINT")" ]; then
            echo "::error::this APK is signed with the WRONG key, so no phone can"
            echo "::error::install it over the current one without being wiped first."
            echo "::error::apksigner: $GOT"
            echo "::error::expected:  $EXPECTED_FINGERPRINT"
            echo "::error::if the keystore secret is wrong, re-upload it - see"
            echo "::error::field_app/SIGNING.md for how to recover the real key."
            exit 1
          fi
          echo "    matches the shop's release key"

      # Read the manifest back OUT of the signed APK and assert that everything
      # the app needs to make a network request is really in the compiled
      # binary. A silently-ignored patch step is exactly what shipped two
      # broken builds in a row, so the build now fails loudly instead of
      # shipping an app that cannot reach the server.
      #
      #   1. android.permission.INTERNET  - Flutter omits it from release
      #      manifests, so without it no request can be made at all.
      #   2. android:networkSecurityConfig - required for a plain http:// URL.
      - name: Verify the APK can actually make network requests
        working-directory: field_app
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls -d "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found - cannot verify the manifest"
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          "$AAPT2" dump permissions "$APK" > permissions.txt

          echo "--- permissions in the shipped APK ---"
          cat permissions.txt

          fail=0
          if ! grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::APK has no android.permission.INTERNET - the app"
            echo "::error::cannot make a single network request"
            fail=1
          fi
          if ! grep -qi "networkSecurityConfig" manifest.txt; then
            echo "::error::APK is missing android:networkSecurityConfig -"
            echo "::error::the app will be unable to reach an http:// server"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "--- manifest dump ---"
            cat manifest.txt
            exit 1
          fi
          echo "OK: INTERNET permission present and cleartext HTTP permitted"

      - name: Checksum
        working-directory: field_app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          sha256sum "$APK" | tee apk-sha256.txt
          echo "size: $(du -h "$APK" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: lubric-field-apk
          path: |
            field_app/build/app/outputs/flutter-apk/app-release.apk
            field_app/apk-sha256.txt
          if-no-files-found: error
