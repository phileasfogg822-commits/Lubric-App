name: Flutter APK

on:
  push:
    branches: [main, master]
    paths: ["field_app/**", ".github/workflows/flutter-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      # The android/ project is generated rather than committed, so nothing
      # custom can be lost. If you ever need native code of your own, commit
      # field_app/android/ and this step becomes a no-op.
      - name: Generate the Android project
        working-directory: field_app
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org app.lubric \
              --project-name lubric_field
            # `flutter create` also drops a placeholder test/widget_test.dart
            # that references a MyApp class this project does not have. Our own
            # tests live in test/ instead.
            rm -f test/widget_test.dart
          fi

      - name: Resolve packages
        working-directory: field_app
        run: flutter pub get

      - name: Analyze
        working-directory: field_app
        run: flutter analyze lib test --no-fatal-infos

      # Runs the widget tests before an APK is ever produced. The setup-screen
      # regression test lives here: it caught a permanently-disabled Pair
      # button that unit review had missed.
      - name: Test
        working-directory: field_app
        run: flutter test --reporter expanded

      - name: Build release APK
        working-directory: field_app
        run: |
          # REQUIRED: fixes two Flutter release-build traps that each make the
          # app unable to reach the server at all:
          #   * android.permission.INTERNET lives only in the debug/profile
          #     manifests, so a release APK cannot make any request;
          #   * cleartext HTTP is blocked by default from Android 9 onwards.
          python3 tool/patch_android.py
          flutter build apk --release

      # Read the manifest back OUT of the signed APK and assert that everything
      # the app needs to make a network request is really in the compiled
      # binary. A silently-ignored patch step is exactly what shipped two
      # broken builds in a row, so the build now fails loudly instead of
      # shipping an app that cannot reach the server.
      #
      #   1. android.permission.INTERNET  - Flutter omits it from release
      #      manifests, so without it no request can be made at all.
      #   2. android:networkSecurityConfig - required for a plain http:// URL.
      - name: Verify the APK can actually make network requests
        working-directory: field_app
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT2=$(ls -d "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found - cannot verify the manifest"
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          "$AAPT2" dump permissions "$APK" > permissions.txt

          echo "--- permissions in the shipped APK ---"
          cat permissions.txt

          fail=0
          if ! grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::APK has no android.permission.INTERNET - the app"
            echo "::error::cannot make a single network request"
            fail=1
          fi
          if ! grep -qi "networkSecurityConfig" manifest.txt; then
            echo "::error::APK is missing android:networkSecurityConfig -"
            echo "::error::the app will be unable to reach an http:// server"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "--- manifest dump ---"
            cat manifest.txt
            exit 1
          fi
          echo "OK: INTERNET permission present and cleartext HTTP permitted"

      - name: Checksum
        working-directory: field_app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          sha256sum "$APK" | tee apk-sha256.txt
          echo "size: $(du -h "$APK" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: lubric-field-apk
          path: |
            field_app/build/app/outputs/flutter-apk/app-release.apk
            field_app/apk-sha256.txt
          if-no-files-found: error
