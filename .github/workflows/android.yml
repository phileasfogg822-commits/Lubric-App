name: Android APK

on:
  push:
    branches: [main, master]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build web assets
        working-directory: mobile
        run: |
          npm ci || npm install
          npm run build

      - name: Add Android platform + sync
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      # @capacitor-community/sqlite requires minSdk 23; Capacitor defaults to 22,
      # which fails the build with "uses-sdk:minSdkVersion 22 cannot be smaller than 23".
      - name: Bump minSdkVersion to 23
        working-directory: mobile
        run: |
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle

      - name: Enable cleartext HTTP for the server IP
        working-directory: mobile
        run: |
          sed -i 's#android:usesCleartextTraffic="false"#android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml || true
          grep -c "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml || true

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (unsigned)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon || true

      - uses: actions/upload-artifact@v4
        with:
          name: lubric-field-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
