# ─── LubricApp — VPS stack (72.61.115.120, app9, no domain yet) ──────────────
# Deploy:   docker compose -f docker-compose.vps.yml up -d --build
# Logs:     docker compose -f docker-compose.vps.yml logs -f api
#
# Ports (chosen to avoid the other apps on this VPS):
#   9000 → API  (desktop sync + APK + health)
#   9001 → Web  (static PWA dashboard, proxies /api to the API)
#   Postgres is NOT published — only containers reach it.
#
# Requires .env next to this file with DB_PASSWORD and JWT_SECRET set.

services:
  db:
    image: postgres:15-alpine
    container_name: lubric9-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-lubricapp}
      POSTGRES_USER: ${DB_USER:-lubric}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - lubric9_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lubric} -d ${DB_NAME:-lubricapp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lubric9-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-lubricapp}
      DB_USER: ${DB_USER:-lubric}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Migrations run as the SUPERUSER (DB_ADMIN_USER, defaulting to DB_USER),
      # because a superuser bypasses row security unconditionally and schema
      # changes and backfills must see every outlet.
      #
      # The app connects as DB_APP_USER: a NOSUPERUSER NOBYPASSRLS role, which is
      # the only kind of role Postgres will actually constrain. Its password must
      # match the one created in server/migrations/029_multi_outlet.sql.
      #
      # Setting this does NOT enable isolation by itself - the policies still need
      # ALTER TABLE ... ENABLE ROW LEVEL SECURITY (migration 030). Switching the
      # role first, while enforcement is off, is deliberate: it proves the grants
      # are complete before they start mattering.
      DB_APP_USER: ${DB_APP_USER:-lubric_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-lubric_app_pw}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    volumes:
      # Published APK builds + android.json. To ship a new app version you
      # drop the APK in here and bump android.json - no rebuild, no restart.
      - ./updates:/app/updates:ro
    ports:
      - "9000:3001"
    depends_on:
      db:
        condition: service_healthy
    # Migrations (001..012, all idempotent) run before the server starts.
    command: sh -c "node migrate.js && node index.js"

  web:
    image: nginx:alpine
    container_name: lubric9-web
    restart: unless-stopped
    ports:
      - "9001:80"
    volumes:
      - ./deploy/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - api

  backup:
    image: postgres:15-alpine
    container_name: lubric9-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/sh
    # Nightly dump at ~02:30 UTC, keep the newest 7.
    command: >
      -c 'while true; do
            now=$$(date -u +%H%M);
            if [ "$$now" = "0230" ]; then
              ts=$$(date -u +%Y%m%d-%H%M);
              pg_dump -h db -U ${DB_USER:-lubric} -d ${DB_NAME:-lubricapp} -Fc
                -f /backups/lubricapp-$$ts.dump && echo "backup ok $$ts";
              ls -1t /backups/lubricapp-*.dump 2>/dev/null | tail -n +8 | xargs -r rm -f;
            fi;
            sleep 60;
          done'

volumes:
  lubric9_pgdata:
