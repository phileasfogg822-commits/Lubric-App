[package]
name = "lubric-app"
version = "0.1.2"
description = "Lubricant Shop POS & Management"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "lubric_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Batch 17 (2026-11-28): in-app updates — the updater plugin checks the
# GitHub Releases feed, verifies the minisign signature against the public
# key in tauri.conf.json, and installs on the user's tap; the process
# plugin restarts the app into the new version. Neither plugin is used
# anywhere else, and both are inert until the user taps "Update now".
tauri-plugin-updater = { version = "2" }
tauri-plugin-process = { version = "2" }
# Batch 6 (2026-11-25): db_pool.rs swaps the sql plugin's pool for one
# connection (SqlitePoolOptions) — needs sqlx directly, same 0.8 the plugin
# already resolves (see Cargo.lock), so no version moves.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tauri-plugin-single-instance = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
