# Static PWA dashboard (dist/) + API proxy, served on host port 9001.
server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# API passthrough so the browser dashboard can use the relative /api base
	# (the PWA is built with VITE_API_URL unset → '/api').
	location /api/ {
		proxy_pass http://api:3001;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# SPA history routing (react-router).
	location / {
		try_files $uri $uri/ /index.html;
	}
}
